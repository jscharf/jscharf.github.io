name: Build Jekyll site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ruby 3.4.11
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.11'
          bundler: '2.6.9'

      - name: Install dependencies
        run: bundle install

      - name: Build site
        run: bundle exec jekyll build
